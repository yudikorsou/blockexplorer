version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hashes-dogecoin-explorer_web_1
      APP_PORT: 3000
      # a public block explorer: no Umbrel login in front of it (it is read-only)
      PROXY_AUTH_ADD: "false"

  web:
    # the official Python image (the same one the Dogecoin Core app uses), running explorer.py: standard library only
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    init: true
    environment:
      HOME: /tmp
      PORT: "3000"
      RPC_HOST: ${APP_DOGECOIN_NODE_IP}
      RPC_PORT: ${APP_DOGECOIN_RPC_PORT}
      RPC_USER: ${APP_DOGECOIN_RPC_USER}
      RPC_PASS: ${APP_HASHES_DOGECOIN_RPC_PASS}
    volumes:
      - ${APP_DATA_DIR}/explorer.py:/app/explorer.py:ro
    command: ["python3", "-u", "/app/explorer.py"]
