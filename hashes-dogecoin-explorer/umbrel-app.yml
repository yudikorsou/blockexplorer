manifestVersion: 1
id: hashes-dogecoin-explorer
category: crypto
name: Dogecoin Explorer
version: "1.7.13"
tagline: A Dogecoin block explorer on your own Dogecoin node
icon: https://raw.githubusercontent.com/yudikorsou/blockexplorer/main/frontend/public/coins/dogecoin.png
description: >-
  A light Dogecoin block explorer that reads every block and the mempool straight from
  the Dogecoin Core app on your Umbrel: no third party sees what you look up. Search by block
  height, block hash or address; merge-mined (AuxPoW) blocks show the pool that mined them.


  It also offers mempool's API and WebSocket for Dogecoin (/api/v1/blocks,
  /api/v1/fees/mempool-blocks, /api/v1/ws), so the hashes.space dashboard and its Find Mempool page
  can stream Dogecoin blocks from your own node. Publish it on the internet (for example with the
  Cloudflare Tunnel app) to make it the Dogecoin block explorer of your website.


  Requires the Dogecoin Core app (doge-dogecoin-core), fully synced.
developer: hashes.space
website: https://hashes.space
dependencies:
  - doge-dogecoin-core
repo: https://github.com/yudikorsou/blockexplorer
