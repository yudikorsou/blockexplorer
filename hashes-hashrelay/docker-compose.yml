version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hashes-hashrelay_web_1
      APP_PORT: 3000
      # the page (and the setting of the pool port) sits behind the Umbrel login; only the read-only list of
      # share hashes is open, so the hashes.space dashboard on your computer can read it
      PROXY_AUTH_WHITELIST: "/api/hashes"

  web:
    # the official Python image (the same one the other hashes.space apps use), running relay.py: standard library only
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    user: "1000:1000"
    restart: on-failure
    init: true
    environment:
      HOME: /tmp
      PORT: "3000"
      STRATUM_PORT: "23340"
      DATA_DIR: /data
      # where the relay forwards to until you set it on the app's page: this Umbrel, port 23339 (DATUM Gateway)
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "23339"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # the miner connects here
      - "23340:23340"
    volumes:
      - ${APP_DATA_DIR}/relay.py:/app/relay.py:ro
      - ${APP_DATA_DIR}/data:/data
    command: ["python3", "-u", "/app/relay.py"]
